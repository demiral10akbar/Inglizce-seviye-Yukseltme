<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A1 → C2 · İngilizce Yol Haritası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12182B;
    --ink-soft:#454E63;
    --muted:#78829A;
    --paper:#F7F7F4;
    --paper-line:rgba(18,24,43,0.07);
    --card:#FFFFFF;
    --card-border:rgba(18,24,43,0.10);
    --a1:#D6483B; --a1-tint:#FBEAE8;
    --a2:#E0912E; --a2-tint:#FCEFE0;
    --b1:#94A82B; --b1-tint:#F0F3DE;
    --b2:#1E8F82; --b2-tint:#E1F1EF;
    --c1:#2E6DB4; --c1-tint:#E4EDF8;
    --c2:#7B4FA0; --c2-tint:#EFE7F4;
    --shadow: 0 1px 2px rgba(18,24,43,0.04), 0 8px 24px -12px rgba(18,24,43,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 28px,
      var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:60px;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',system-ui,sans-serif;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}

  /* ---------- header ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:rgba(247,247,244,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--paper-line);
    padding:14px 20px;
  }
  .topbar-inner{
    max-width:1180px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand-mark{
    font-family:'IBM Plex Mono'; font-weight:600; font-size:11px;
    letter-spacing:0.14em; color:var(--muted); border:1px solid var(--card-border);
    border-radius:999px; padding:3px 9px;
  }
  .brand h1{font-size:19px; margin:0; font-weight:700; letter-spacing:-0.01em;}
  .student-switch{
    display:flex; gap:4px; background:var(--card); border:1px solid var(--card-border);
    border-radius:12px; padding:8px 14px; box-shadow:var(--shadow);
  }
  .student-switch:empty{display:none;}
  .student-btn{
    border:none; background:transparent; padding:8px 14px; border-radius:8px;
    font-size:13.5px; font-weight:600; color:var(--muted); transition:all .15s ease;
    display:flex; flex-direction:column; align-items:flex-start; line-height:1.25;
  }
  .student-btn .grade{font-weight:500; font-size:11px; opacity:.8;}
  .student-btn.active{background:var(--ink); color:#fff;}
  .student-btn.active .grade{color:rgba(255,255,255,.72);}

  /* identity chip + logout (replaces student switch once logged in) */
  .identity-chip{
    display:flex; align-items:center; gap:10px; background:transparent; border:none;
    border-radius:0; padding:0; box-shadow:none;
  }
  .identity-chip .who{font-size:13.5px; font-weight:700;}
  .identity-chip .role-tag{
    font-family:'IBM Plex Mono'; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted); border:1px solid var(--card-border); border-radius:999px; padding:2px 8px;
  }
  .logout-btn{border:none; background:transparent; color:var(--muted); font-size:12px; padding:6px 10px; border-radius:8px;}
  .logout-btn:hover{background:var(--paper); color:var(--ink);}

  /* lock screen */
  .lock-shell{max-width:440px; margin:64px auto; padding:0 20px;}
  .lock-card{
    background:var(--card); border:1px solid var(--card-border); border-radius:20px;
    padding:32px 28px; box-shadow:var(--shadow); text-align:center;
  }
  .lock-card .lock-eyebrow{font-family:'IBM Plex Mono'; font-size:11px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase;}
  .lock-card h2{font-size:22px; margin:8px 0 4px;}
  .lock-card .lock-sub{font-size:13px; color:var(--muted); margin-bottom:24px;}
  .profile-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:8px;}
  .profile-btn{
    border:1px solid var(--card-border); background:var(--paper); border-radius:14px;
    padding:18px 10px; font-family:'Space Grotesk'; font-weight:600; font-size:14.5px;
    display:flex; flex-direction:column; align-items:center; gap:8px; transition:transform .12s ease;
  }
  .profile-btn:hover{transform:translateY(-2px);}
  .profile-avatar{
    width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk'; font-weight:700; font-size:16px; color:#fff;
  }
  .profile-btn.admin{grid-column:1 / -1; background:var(--ink); color:#fff; flex-direction:row; justify-content:center; padding:13px;}
  .profile-btn.admin .profile-avatar{background:rgba(255,255,255,.15); width:26px; height:26px; font-size:12px;}
  .lock-form{margin-top:20px; text-align:left;}
  .lock-form label{display:block; font-size:11.5px; color:var(--muted); font-family:'IBM Plex Mono'; margin-bottom:6px;}
  .lock-form input{
    width:100%; border:1px solid var(--card-border); border-radius:10px; padding:11px 13px;
    font-size:15px; letter-spacing:.08em; font-family:'IBM Plex Mono'; background:var(--paper);
  }
  .lock-form input:focus{outline:2px solid var(--ink); outline-offset:1px;}
  .lock-actions{display:flex; gap:8px; margin-top:14px;}
  .lock-submit{flex:1; background:var(--ink); color:#fff; border:none; border-radius:10px; padding:11px; font-weight:600; font-size:13.5px;}
  .lock-back{background:transparent; border:1px solid var(--card-border); border-radius:10px; padding:11px 14px; font-size:13px; color:var(--muted);}
  .lock-error{color:#D6483B; font-size:12.5px; margin-top:10px;}

  /* admin home */
  .admin-hero{
    background:var(--ink); color:#fff; border-radius:20px; padding:26px 28px; margin-bottom:20px;
  }
  .admin-hero .lock-eyebrow{color:rgba(255,255,255,.6);}
  .admin-hero h2{font-size:24px; margin:6px 0 0;}
  .admin-student-row{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    background:var(--card); border:1px solid var(--card-border); border-radius:16px 16px 0 0; padding:18px 20px;
    box-shadow:var(--shadow); margin-bottom:0;
  }
  .admin-level-bars{
    background:var(--card); border:1px solid var(--card-border); border-top:none; border-radius:0 0 16px 16px;
    padding:14px 20px 18px; margin-bottom:16px; display:flex; flex-direction:column; gap:8px;
  }
  .admin-level-bars .level-bar-row{cursor:pointer;}
  .admin-level-bars .level-bar-row .lv-pct{width:56px;}
  .admin-student-row .as-left{display:flex; align-items:center; gap:14px;}
  .admin-student-row .as-name{font-family:'Space Grotesk'; font-size:16px; font-weight:700;}
  .admin-student-row .as-sub{font-size:12px; color:var(--muted);}
  .admin-panel-section{
    background:var(--card); border:1px solid var(--card-border); border-radius:16px;
    padding:20px 22px; margin-top:20px; box-shadow:var(--shadow);
  }
  .admin-panel-section h4{margin:0 0 4px;}
  .admin-panel-section .sub{font-size:12.5px; color:var(--muted); margin-bottom:16px;}
  .pw-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:14px;}
  .pw-grid label{display:block; font-size:11.5px; color:var(--muted); font-family:'IBM Plex Mono'; margin-bottom:5px;}
  .pw-grid input{width:100%; border:1px solid var(--card-border); border-radius:9px; padding:9px 10px; font-size:13.5px; font-family:'IBM Plex Mono'; background:var(--paper);}
  .save-pw-btn{background:var(--ink); color:#fff; border:none; border-radius:9px; padding:9px 16px; font-size:12.5px; font-weight:600;}
  .pw-saved-msg{color:#1E8F82; font-size:12px; margin-left:10px;}
  .admin-back-banner{
    display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--ink); color:#fff;
    border-radius:12px; padding:10px 16px; margin-bottom:16px; font-size:13px;
  }
  .admin-back-banner button{background:rgba(255,255,255,.15); border:none; color:#fff; border-radius:8px; padding:6px 12px; font-size:12px;}

  /* ---------- layout ---------- */
  .shell{max-width:1180px; margin:0 auto; padding:26px 20px 0; display:grid; grid-template-columns:96px 1fr; gap:22px;}
  @media (max-width:820px){ .shell{grid-template-columns:1fr;} }

  /* ---------- spine ---------- */
  .spine{position:sticky; top:82px; align-self:start; display:flex; flex-direction:column; gap:8px;}
  @media (max-width:820px){
    .spine{position:static; flex-direction:row; overflow-x:auto; padding-bottom:6px; gap:8px;}
    .spine::-webkit-scrollbar{display:none;}
  }
  .spine-btn{
    border:1px solid var(--card-border); background:var(--card); border-radius:14px;
    padding:10px 8px; display:flex; flex-direction:column; align-items:center; gap:6px;
    min-width:74px; box-shadow:var(--shadow); transition:transform .12s ease, box-shadow .12s ease;
  }
  .spine-btn:hover{transform:translateY(-1px);}
  .spine-btn.current{outline:2px solid var(--lvl); outline-offset:2px;}
  .spine-ring{
    width:38px; height:38px; border-radius:50%;
    background:conic-gradient(var(--lvl) calc(var(--pct)*3.6deg), var(--paper-line) 0);
    display:flex; align-items:center; justify-content:center; padding:3px;
  }
  .spine-ring-inner{
    width:100%; height:100%; border-radius:50%; background:var(--card);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono'; font-weight:600; font-size:11px; color:var(--lvl);
  }
  .spine-label{font-size:10px; color:var(--muted); font-weight:600;}
  .spine-btn.done .spine-label{color:#1E8F82; font-weight:700;}
  .spine-check{background:#1E8F82 !important; color:#fff !important; font-size:15px;}
  .spine-overview-btn{
    border:1px dashed var(--card-border); background:transparent; border-radius:14px;
    padding:10px 6px; font-family:'IBM Plex Mono'; font-size:10px; font-weight:600;
    color:var(--muted); min-width:74px;
  }
  .spine-overview-btn.current{border-color:var(--ink); color:var(--ink);}

  /* ---------- main ---------- */
  main{min-width:0; padding-bottom:40px;}

  /* overview */
  .hero{
    background:linear-gradient(135deg, var(--ink) 0%, #232D4B 100%);
    color:#fff; border-radius:20px; padding:34px 30px; margin-bottom:22px;
    position:relative; overflow:hidden;
  }
  .hero::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(90deg, var(--a1),var(--a2),var(--b1),var(--b2),var(--c1),var(--c2));
    opacity:.9; height:5px; top:auto; bottom:0;
  }
  .hero h2{font-size:28px; margin:0 0 8px; letter-spacing:-0.01em;}
  .hero p{margin:0; color:rgba(255,255,255,.75); font-size:14.5px; max-width:60ch; line-height:1.55;}
  .hero-stats{display:flex; gap:28px; margin-top:22px; flex-wrap:wrap;}
  .hero-stat b{display:block; font-family:'Space Grotesk'; font-size:26px;}
  .hero-stat span{font-size:11.5px; color:rgba(255,255,255,.65); font-family:'IBM Plex Mono';}

  .overview-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:700px){ .overview-grid{grid-template-columns:1fr;} }
  .student-card{
    background:var(--card); border:1px solid var(--card-border); border-radius:18px;
    padding:20px; box-shadow:var(--shadow);
  }
  .student-card h3{margin:0 0 2px; font-size:17px;}
  .student-card .sub{color:var(--muted); font-size:12.5px; margin-bottom:16px;}
  .big-progress{display:flex; align-items:center; gap:14px; margin-bottom:18px;}
  .big-ring{width:64px; height:64px; border-radius:50%; flex:none;
    background:conic-gradient(var(--ink) calc(var(--pct)*3.6deg), var(--paper-line) 0);
    display:flex; align-items:center; justify-content:center; padding:5px;}
  .big-ring-inner{width:100%; height:100%; border-radius:50%; background:var(--card);
    display:flex; align-items:center; justify-content:center; flex-direction:column;}
  .big-ring-inner b{font-family:'Space Grotesk'; font-size:15px; line-height:1;}
  .big-ring-inner span{font-size:9px; color:var(--muted); font-family:'IBM Plex Mono';}
  .big-progress-text b{font-family:'Space Grotesk'; font-size:15px;}
  .big-progress-text div{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .level-bars{display:flex; flex-direction:column; gap:8px;}
  .completed-badges{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;}
  .completed-badge{
    font-size:11.5px; font-weight:600; padding:5px 10px; border-radius:999px;
    background:color-mix(in srgb, var(--lvl) 14%, white); color:var(--lvl);
    border:1px solid color-mix(in srgb, var(--lvl) 35%, white);
  }
  .level-bar-row{display:flex; align-items:center; gap:10px;}
  .level-bar-row .lv-code{width:26px; font-family:'IBM Plex Mono'; font-size:11px; font-weight:600; color:var(--muted);}
  .level-bar-track{flex:1; height:8px; border-radius:999px; background:var(--paper-line); overflow:hidden;}
  .level-bar-fill{height:100%; border-radius:999px;}
  .level-bar-row .lv-pct{width:34px; text-align:right; font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--muted);}
  .level-bar-row{cursor:pointer;}

  /* level view */
  .level-header{
    border-radius:20px; padding:26px 28px; margin-bottom:20px; color:#fff;
    background:linear-gradient(135deg, var(--lvl) 0%, color-mix(in srgb, var(--lvl) 70%, #12182B) 100%);
    box-shadow:var(--shadow);
  }
  .level-header .eyebrow{font-family:'IBM Plex Mono'; font-size:11px; letter-spacing:.14em; opacity:.8; text-transform:uppercase;}
  .level-header h2{font-size:26px; margin:6px 0 4px;}
  .level-header .meta{font-size:13px; opacity:.85; margin-bottom:16px;}
  .goal-chips{display:flex; flex-wrap:wrap; gap:8px;}
  .goal-chip{
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.28);
    padding:6px 12px; border-radius:999px; font-size:12.5px;
  }
  .level-complete-banner{
    display:flex; align-items:center; margin-bottom:18px; padding:14px 18px; border-radius:14px;
    background:color-mix(in srgb, var(--lvl) 10%, white); border:1px solid color-mix(in srgb, var(--lvl) 30%, white);
  }
  .lcb-left{display:flex; align-items:center; gap:12px;}
  .lcb-check{
    width:34px; height:34px; border-radius:50%; background:var(--lvl); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:17px; flex:none;
  }
  .lcb-sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}

  .week-card{
    background:var(--card); border:1px solid var(--card-border); border-radius:16px;
    margin-bottom:12px; box-shadow:var(--shadow); overflow:hidden;
  }
  .week-head{
    display:flex; align-items:center; gap:14px; padding:16px 18px; cursor:pointer;
    user-select:none;
  }
  .week-num{
    font-family:'IBM Plex Mono'; font-weight:600; font-size:12px; color:#fff;
    background:var(--lvl); border-radius:8px; width:34px; height:34px;
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .week-head-text{flex:1; min-width:0;}
  .week-head-text h4{margin:0; font-size:15px;}
  .week-head-text .grammar-preview{font-size:12px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .week-dots{display:flex; gap:5px; flex:none;}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--paper-line); border:1px solid var(--card-border);}
  .dot.done{background:var(--lvl); border-color:var(--lvl);}
  .chevron{color:var(--muted); font-size:13px; transition:transform .18s ease; flex:none;}
  .week-card.open .chevron{transform:rotate(90deg);}
  .week-body{max-height:0; overflow:hidden; transition:max-height .25s ease;}
  .week-card.open .week-body{max-height:900px;}
  .week-body-inner{padding:0 18px 20px; border-top:1px solid var(--paper-line); padding-top:16px;}
  .wb-section{margin-bottom:14px;}
  .wb-label{font-family:'IBM Plex Mono'; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px;}
  .grammar-explain-list{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .grammar-explain-item{
    font-size:13px; line-height:1.55; color:var(--ink-soft); background:var(--paper);
    border-left:3px solid var(--lvl); border-radius:0 8px 8px 0; padding:8px 12px;
  }
  .grammar-explain-item b{color:var(--lvl); margin-right:4px;}
  .vocab-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px;}
  .vocab-card{
    background:var(--paper); border:1px solid var(--card-border); border-radius:9px;
    padding:8px 10px; display:flex; flex-direction:column; gap:2px;
  }
  .vocab-card b{font-size:13px;}
  .vocab-card span{font-size:11.5px; color:var(--muted);}
  .practice-toggle-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .match-panel{margin-top:12px; padding:14px; border-radius:10px; background:var(--card); border:1px solid var(--card-border);}
  .match-cols{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .match-col{display:flex; flex-direction:column; gap:6px;}
  .match-item{
    border:1px solid var(--card-border); background:var(--paper); border-radius:8px;
    padding:8px 10px; font-size:12.5px; text-align:left; color:var(--ink-soft);
  }
  .match-item.selected{border-color:var(--lvl); background:color-mix(in srgb, var(--lvl) 12%, white);}
  .match-item.matched{background:#E7F5EC; border-color:#2E8B57; color:#1F6B41; opacity:.75;}
  .match-item.wrong{background:#FBEAE8; border-color:#D6483B; color:#A5372B;}
  .match-footer{display:flex; align-items:center; gap:12px; margin-top:12px; flex-wrap:wrap;}
  .match-progress{font-size:12px; color:var(--muted); font-family:'IBM Plex Mono';}
  .match-done{font-size:12.5px; color:#1F6B41; font-weight:600;}
  .study-passage{
    background:var(--paper); border:1px solid var(--card-border); border-radius:10px;
    padding:12px 14px; font-size:13px; line-height:1.65; color:var(--ink-soft); margin-top:10px;
  }
  .check-list{margin-top:10px; display:flex; flex-direction:column; gap:8px;}
  .check-q{font-size:12.5px;}
  .check-q-text{color:var(--ink-soft); margin-bottom:4px;}
  .check-reveal-btn{
    background:transparent; border:1px solid var(--card-border); color:var(--lvl);
    border-radius:7px; padding:4px 10px; font-size:11.5px;
  }
  .check-q-answer{margin-top:5px; padding:6px 10px; background:var(--paper); border-radius:7px; color:var(--ink-soft); font-style:italic;}
  .writing-hint{
    margin-top:8px; font-size:12.5px; color:var(--ink-soft); background:var(--paper);
    border-left:3px solid var(--lvl); border-radius:0 8px 8px 0; padding:8px 12px; line-height:1.5;
  }
  .tag-row{display:flex; flex-wrap:wrap; gap:6px;}
  .tag{background:var(--paper); border:1px solid var(--card-border); border-radius:8px; padding:4px 9px; font-size:12.5px; color:var(--ink-soft);}
  .wb-text{font-size:13.5px; color:var(--ink-soft); line-height:1.5;}
  .example-box{
    border-left:3px solid var(--lvl); background:var(--paper); padding:10px 14px; border-radius:0 10px 10px 0;
    font-size:13px; color:var(--ink-soft); font-style:italic; line-height:1.55;
  }
  .writing-target{
    display:inline-block; margin-left:8px; font-family:'IBM Plex Mono'; font-size:11px;
    color:var(--lvl); background:color-mix(in srgb, var(--lvl) 12%, white); padding:2px 8px; border-radius:999px;
  }
  .lesson-checks{display:flex; flex-direction:column; gap:8px; margin-top:14px;}
  .lesson-check{
    display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:10px;
    background:var(--paper); border:1px solid var(--card-border); font-size:13px; cursor:pointer;
  }
  .lesson-check input{width:16px; height:16px; accent-color:var(--lvl); flex:none;}
  .lesson-check.checked{background:color-mix(in srgb, var(--lvl) 8%, white); border-color:color-mix(in srgb, var(--lvl) 35%, white);}
  .lesson-check .lc-label b{font-weight:600;}

  .exam-card{
    background:var(--card); border:1px solid var(--card-border); border-radius:16px;
    padding:20px 22px; margin-top:22px; box-shadow:var(--shadow);
  }
  .exam-card h4{margin:0 0 4px; font-size:15.5px;}
  .exam-card .sub{font-size:12.5px; color:var(--muted); margin-bottom:16px;}

const usingArtifactStorage = (typeof window !== 'undefined') && window.storage && typeof window.storage.get === 'function';
const STORAGE_PREFIX = 'ingilizce-programi:';

const storageAdapter = {
  async get(key){
    if(usingArtifactStorage){
      try{ return await window.storage.get(key); }catch(e){ return null; }
    }
    try{
      const val = window.localStorage.getItem(STORAGE_PREFIX + key);
      return val !== null ? {key, value: val} : null;
    }catch(e){ return null; }
  },
  async set(key, value){
    if(usingArtifactStorage){
      try{ return await window.storage.set(key, value); }catch(e){ return null; }

    try{
      window.localStorage.setItem(STORAGE_PREFIX + key, value);

};

function emptyData(){ return {completed:{}, exams:{}, writing:{}}; }

function shuffleQuestion(item){
  const idx = item.o.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  return {q:item.q, options: idx.map(i=>item.o[i]), correct: idx.indexOf(item.a)};
}

async function loadStudent(id){
  if(cache[id]) return cache[id];
  try{
    const res = await storageAdapter.get('student-data:'+id);
    if(res && res.value){
      cache[id] = JSON.parse(res.value);
      if(!cache[id].completed) cache[id].completed = {};
      if(!cache[id].exams) cache[id].exams = {};
      if(!cache[id].writing) cache[id].writing = {};
    } else {
      cache[id] = emptyData();
    }
  }catch(e){
    cache[id] = emptyData();
  }
  return cache[id];
}

async function saveStudent(id){
  try{
    await storageAdapter.set('student-data:'+id, JSON.stringify(cache[id]));
  }catch(e){ /* ignore transient storage errors */ }
}

async function loadPasswords(){
  if(passwords) return passwords;
  try{
    const res = await storageAdapter.get('app-passwords');
    passwords = (res && res.value) ? JSON.parse(res.value) : {...DEFAULT_PASSWORDS};
  }catch(e){
    passwords = {...DEFAULT_PASSWORDS};
  }
  return passwords;
}

async function savePasswords(){
  try{ await storageAdapter.set('app-passwords', JSON.stringify(passwords)); }catch(e){ /* ignore */ }
}

let openaiKey = null; // loaded once from storage; null string means "not set"

async function loadOpenaiKey(){
  if(openaiKey !== null) return openaiKey;
  try{
    const res = await storageAdapter.get('openai-api-key');
    openaiKey = (res && res.value) ? res.value : '';
  }catch(e){
    openaiKey = '';
  }
  return openaiKey;
}

async function saveOpenaiKey(key){
  openaiKey = key;
  try{ await storageAdapter.set('openai-api-key', key); }catch(e){ /* ignore */ }
}

function lessonId(level, weekIdx, dayIdx){ return level+"-w"+(weekIdx+1)+"-d"+(dayIdx+1); }

function levelProgress(studentId, level){
  const d = cache[studentId];
  if(!d) return 0;
  let done = 0;
  for(let w=0; w<8; w++){ for(let day=0; day<3; day++){ if(d.completed[lessonId(level,w,day)]) done++; } }
  return done; // out of 24
}

function overallProgress(studentId){
  let total = 0;
  LEVEL_IDS.forEach(l=> total += levelProgress(studentId,l));
  return total; // out of 144
}

function currentLevelFor(studentId){
  for(const l of LEVEL_IDS){ if(levelProgress(studentId,l) < 24) return l; }
  return "C2";
}

function bandFor(levelId, totalScore){
  const bands = LEVEL_META[levelId].bands;
  for(const b of bands){ if(totalScore >= b[0]) return b; }
  return bands[bands.length-1];
}

function splitMax(max, n){
  const base = Math.floor(max/n);
  const rem = max - base*n;
  const arr = [];
  for(let i=0;i<n;i++){ arr.push(base + (i<rem?1:0)); }
  return arr;
}

function rubricCriteria(max){
  const parts = splitMax(max, 4);
  return [
    {key:'task', label:'Görev Tamamlama', desc:'Konu tam işlendi mi? Kelime sayısı hedefe yakın mı?', max:parts[0]},
    {key:'grammar', label:'Gramer Doğruluğu', desc:'Bu haftaki ve önceki gramer yapıları doğru kullanılmış mı?', max:parts[1]},
    {key:'vocab', label:'Kelime Kullanımı', desc:'Seviyeye uygun, çeşitli kelimeler kullanılmış mı? Tekrar var mı?', max:parts[2]},
    {key:'coherence', label:'Akıcılık & Düzen', desc:'Fikirler mantıklı sırayla mı? Bağlaçlar (however, because, so...) kullanılmış mı?', max:parts[3]}
  ];
}

function writingPromptFor(levelId, label){
  // Find the writing prompt from the final review week, or fall back to a generic description
  const weeks = WEEKS[levelId];
  const finalWeek = weeks[weeks.length-1];
  if(/paraphrase|özet|summary/i.test(label)){
    const w4 = weeks[3];
    return w4 && w4.w ? w4.w : "Verilen metni kendi cümlelerinle özetle.";
  }
  if(/synth/i.test(label)){
    const w4 = weeks[3];
    return w4 && w4.w ? w4.w : "İki farklı kaynaktaki bilgileri karşılaştırarak yaz.";
  }
  return finalWeek && finalWeek.w ? finalWeek.w : "Seviyeye uygun bir konu hakkında yaz.";
}

function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function renderMatchGame(wk, color){
  if(!matchGame){
    const ids = wk.vx.map((_,i)=>i);
    matchGame = {
      left: shuffleArr(ids.map(i=>({id:i, text:wk.vx[i].en}))),
      right: shuffleArr(ids.map(i=>({id:i, text:wk.vx[i].tr}))),
      matched: new Set(),
      selLeft: null, selRight: null, wrong: false
    };
  }
  const g = matchGame;
  const done = g.matched.size === g.left.length;
  let html = `<div class="match-panel" style="--lvl:${color}">
    <div class="match-cols">
      <div class="match-col">${g.left.map(item=>{
        let cls = 'match-item';
        if(g.matched.has(item.id)) cls += ' matched';
        else if(g.selLeft===item.id) cls += g.wrong ? ' wrong' : ' selected';
        return `<button class="${cls}" data-match-left="${item.id}" ${g.matched.has(item.id)?'disabled':''}>${item.text}</button>`;
      }).join('')}</div>
      <div class="match-col">${g.right.map(item=>{
        let cls = 'match-item';
        if(g.matched.has(item.id)) cls += ' matched';
        else if(g.selRight===item.id) cls += g.wrong ? ' wrong' : ' selected';
        return `<button class="${cls}" data-match-right="${item.id}" ${g.matched.has(item.id)?'disabled':''}>${item.text}</button>`;
      }).join('')}</div>
    </div>
    <div class="match-footer">
      <span class="match-progress">${g.matched.size} / ${g.left.length} eşleşti</span>
      ${done ? '<span class="match-done">Tamamlandı! 🎉</span>' : ''}
      <button class="test-btn secondary" data-match-reshuffle="1">Yeniden Karıştır</button>
    </div>
  </div>`;
  return html;
}

function renderTranslateDrill(wk, levelId, wi, color){
  const key = "tr-"+levelId+"-"+wi;
  const items = shuffleArr(wk.vx.map((v,i)=>({q:v.tr+" → İngilizcesi?", a:v.en, i})));
  let html = `<div class="check-list">`;
  items.forEach((item,qi)=>{
    html += `<div class="check-q">
      <div class="check-q-text">${qi+1}. ${item.q}</div>
      <button class="check-reveal-btn" data-reveal="${key}:${qi}">Cevabı Göster</button>
      <div class="check-q-answer" id="reveal-${key}-${qi}" style="display:none;">${item.a}</div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function renderQuizPanel(levelId, testType, label, max, color){
  const testData = LEVEL_TESTS[levelId][testType];
  const questions = testType === 'reading' ? testData.questions : testData;

  if(!quizShuffled){
    quizShuffled = questions.map(shuffleQuestion);
    quizSelections = {};
    quizSubmitted = false;
  }

  let html = `<div class="quiz-panel" style="--lvl:${color}">`;
  if(testType === 'reading'){
    html += `<div class="quiz-passage">${testData.passage}</div>`;
  }
  quizShuffled.forEach((item, qi)=>{
    html += `<div class="quiz-q">
      <div class="quiz-q-text">${qi+1}. ${item.q}</div>
      <div class="quiz-options">`;
    item.options.forEach((opt, oi)=>{
      let cls = 'quiz-option';
      const selected = quizSelections[qi] === oi;
      if(selected) cls += ' selected';
      if(quizSubmitted){
        if(oi === item.correct) cls += ' correct';
        else if(selected && oi !== item.correct) cls += ' wrong';
      }
      html += `<label class="${cls}">
        <input type="radio" name="quiz-q-${qi}" ${selected?'checked':''} ${quizSubmitted?'disabled':''} data-quiz-select="${qi}:${oi}">
        <span>${opt}</span>
      </label>`;
    });
    html += `</div></div>`;
  });

  const answeredCount = Object.keys(quizSelections).length;
  if(!quizSubmitted){
    html += `<div class="quiz-actions">
      <button class="test-btn" data-submit-quiz="1" ${answeredCount<quizShuffled.length?'disabled':''}>Testi Bitir</button>
      <span style="font-size:12px; color:var(--muted);">${answeredCount}/${quizShuffled.length} soru cevaplandı</span>
    </div>`;
  } else {
    let correctCount = 0;
    quizShuffled.forEach((item,qi)=>{ if(quizSelections[qi] === item.correct) correctCount++; });
    const score = Math.round(correctCount/quizShuffled.length*max);
    html += `<div class="quiz-actions">
      <div class="quiz-result">${correctCount}/${quizShuffled.length} doğru → <b>${score}/${max} puan</b></div>
      <button class="test-btn secondary" data-close-quiz="1">Kapat</button>
      <button class="test-btn secondary" data-retake-quiz="${testType}">Tekrar Çöz</button>
    </div>`;
  }
  html += `</div>`;
  return html;
}

      const bandEl = main.querySelector('.exam-band');
      bandEl.textContent = b[1];
      bandEl.style.background = b[2]+"22";
      bandEl.style.color = b[2];
    });
  });

  // --- quiz interactions ---
  main.querySelectorAll('[data-open-quiz]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      openQuiz = btn.dataset.openQuiz;
      quizShuffled = null; quizSelections = {}; quizSubmitted = false;
      renderLevel(levelId);
    });
  });
  main.querySelectorAll('[data-quiz-select]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const [qi,oi] = inp.dataset.quizSelect.split(':').map(Number);
      quizSelections[qi] = oi;
      renderLevel(levelId);
    });
  });
  const submitQuizBtn = main.querySelector('[data-submit-quiz]');
  if(submitQuizBtn){
    submitQuizBtn.addEventListener('click', async ()=>{
      quizSubmitted = true;
      let correctCount = 0;
      quizShuffled.forEach((item,qi)=>{ if(quizSelections[qi] === item.correct) correctCount++; });
      const [label,max] = meta.exam[["vocab","grammar","reading"].indexOf(openQuiz)];
      const score = Math.round(correctCount/quizShuffled.length*max);
      if(!studentData.exams[levelId]) studentData.exams[levelId] = {};
      studentData.exams[levelId][label] = score;
      await saveStudent(currentStudent);
      renderSpine();
      renderLevel(levelId);
    });
  }
  const closeQuizBtn = main.querySelector('[data-close-quiz]');
  if(closeQuizBtn){
    closeQuizBtn.addEventListener('click', ()=>{
      openQuiz = null; quizShuffled = null; quizSelections = {}; quizSubmitted = false;
      renderLevel(levelId);
    });
  }
  const retakeQuizBtn = main.querySelector('[data-retake-quiz]');
  if(retakeQuizBtn){
    retakeQuizBtn.addEventListener('click', ()=>{
      quizShuffled = null; quizSelections = {}; quizSubmitted = false;
      renderLevel(levelId);
    });
  }

  // --- writing / AI-graded sections ---
  main.querySelectorAll('[data-toggle-writing]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.toggleWriting;
      openWriting[key] = !openWriting[key];
      renderLevel(levelId);
    });
  });
  main.querySelectorAll('[data-writing-text]').forEach(ta=>{
    ta.addEventListener('input', ()=>{
      const wc = ta.closest('.writing-panel').querySelector('.word-count');
      const n = ta.value.trim().split(/\s+/).filter(Boolean).length;
      if(wc) wc.textContent = n + " kelime";
    });
    ta.addEventListener('change', async ()=>{
      const key = ta.dataset.writingText;
      if(!studentData.writing[key]) studentData.writing[key] = {};
      studentData.writing[key].text = ta.value;
      await saveStudent(currentStudent);
    });
  });
  main.querySelectorAll('[data-ai-grade]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const key = btn.dataset.aiGrade;
      const label = btn.dataset.label;
      const max = Number(btn.dataset.max);
      const panel = btn.closest('.writing-panel');
      const text = panel.querySelector('[data-writing-text]').value.trim();
      if(!text){ alert("Değerlendirme için önce bir cevap yazılmalı."); return; }
      if(!studentData.writing[key]) studentData.writing[key] = {};
      studentData.writing[key].text = text;
      aiLoading[key] = true;
      renderLevel(levelId);
      try{
        const promptText = writingPromptFor(levelId, label);
        const result = await gradeWriting(levelId, promptText, max, text);
        studentData.writing[key].score = result.score;
        studentData.writing[key].feedback = result.feedback;
        delete studentData.writing[key].error;
        if(!studentData.exams[levelId]) studentData.exams[levelId] = {};
        studentData.exams[levelId][label] = result.score;
      }catch(e){
        const svc = openaiKey ? 'ChatGPT' : 'Claude';
        studentData.writing[key].error = svc + " ile değerlendirme yapılamadı. Aşağıdaki rubric ile elle puanlayabilirsin. (" + (e && e.message ? e.message : "bilinmeyen hata") + ")";
      }
      aiLoading[key] = false;
      await saveStudent(currentStudent);
      renderSpine();
      renderLevel(levelId);
    });
  });

  const resetBtn = document.getElementById('resetLevelBtn');
  if(resetBtn){
    resetBtn.addEventListener('click', async ()=>{
      if(!confirm(levelId+" seviyesindeki tüm işaretlenmiş dersler ve sınav notu silinsin mi?")) return;
      for(let w=0; w<8; w++){ for(let d=0; d<3; d++){ delete studentData.completed[lessonId(levelId,w,d)]; } }
      delete studentData.exams[levelId];
      Object.keys(studentData.writing).forEach(k=>{ if(k.startsWith(levelId+':')) delete studentData.writing[k]; });
      await saveStudent(currentStudent);
      renderSpine();
      renderLevel(levelId);
    });
  }
}

function buildGradingInstruction(levelId, promptText, max){
  return "You are an experienced English teacher grading a "+levelId+"-level CEFR English task for a Turkish teenage student. "+
    "Task/prompt: \""+promptText+"\". "+
    "Grade the student's response strictly out of "+max+" points, considering task achievement, grammar accuracy, vocabulary range, and coherence appropriate for "+levelId+" level (be realistic, not overly generous). "+
    "Respond ONLY with a single valid JSON object and nothing else, no markdown fences: "+
    "{\"score\": <integer 0 to "+max+">, \"feedback\": \"<2-3 sentence constructive feedback IN TURKISH>\"}";
}

async function gradeWithAI(levelId, promptText, max, studentText){
  const instruction = buildGradingInstruction(levelId, promptText, max);

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [
        { role: "user", content: instruction + "\n\nStudent's response:\n" + studentText }
      ]
    })
  });
  if(!response.ok){ throw new Error("Claude API isteği başarısız (" + response.status + ")"); }
  const data = await response.json();
  const textBlocks = (data.content || []).filter(b=>b.type === "text").map(b=>b.text).join("\n");
  const cleaned = textBlocks.replace(/```json|```/g,'').trim();
  const parsed = JSON.parse(cleaned);
  if(typeof parsed.score !== 'number') throw new Error("Geçersiz yanıt formatı");
  parsed.score = Math.max(0, Math.min(max, Math.round(parsed.score)));
  return parsed;
}

async function gradeWithOpenAI(levelId, promptText, max, studentText, apiKey){
  const instruction = buildGradingInstruction(levelId, promptText, max);

  const response = await fetch("https://api.openai.com/v1/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + apiKey
    },
    body: JSON.stringify({
      model: "gpt-4o-mini",
      response_format: { type: "json_object" },
      messages: [
        { role: "system", content: "You are an experienced English teacher. Always respond with a single valid JSON object only." },
        { role: "user", content: instruction + "\n\nStudent's response:\n" + studentText }
      ]
    })
  });
  if(!response.ok){
    let detail = '';
    try{ const errBody = await response.json(); detail = errBody?.error?.message ? (' — ' + errBody.error.message) : ''; }catch(e){}
    throw new Error("ChatGPT API isteği başarısız (" + response.status + ")" + detail);
  }
  const data = await response.json();
  const text = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : '';
  const cleaned = (text || '').replace(/```json|```/g,'').trim();
  const parsed = JSON.parse(cleaned);
  if(typeof parsed.score !== 'number') throw new Error("Geçersiz yanıt formatı");
  parsed.score = Math.max(0, Math.min(max, Math.round(parsed.score)));
  return parsed;
}

async function gradeWriting(levelId, promptText, max, studentText){
  if(openaiKey){
    return await gradeWithOpenAI(levelId, promptText, max, studentText, openaiKey);
  }
  return await gradeWithAI(levelId, promptText, max, studentText);
}

async function renderAll(){
  await loadPasswords();
  await loadOpenaiKey();
  renderAuthBar();

  if(!authedAs){
    renderLockScreen();
    return;
  }

  if(authedAs === 'admin'){
    await Promise.all(STUDENTS.map(s=>loadStudent(s.id)));
    renderSpine();
    if(!adminViewStudent){
      renderAdminHome();
    } else if(currentView === 'overview'){
      renderOverview();
    } else {
      renderLevel(currentView);
    }
    return;
  }

  // student login
  await loadStudent(currentStudent);
  renderSpine();
  if(currentView === 'overview'){
    renderOverview();
  } else {
    renderLevel(currentView);
  }
}

renderAll();
})();
